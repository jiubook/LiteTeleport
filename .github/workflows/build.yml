name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Extract version info from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PLUGIN_VERSION="${TAG%%-*}"
          echo "plugin_version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "Plugin version: $PLUGIN_VERSION"

      - name: Install local lib JARs to Maven repo
        run: |
          mvn install:install-file -Dfile=lib/FoliaCompatibleAPI-1.2.0.jar \
            -DgroupId=net.myunco -DartifactId=folia-compatible-api \
            -Dversion=1.2.0 -Dpackaging=jar
          mvn install:install-file -Dfile=lib/PlaceholderAPI-2.11.3.jar \
            -DgroupId=me.clip -DartifactId=placeholderapi \
            -Dversion=2.11.3 -Dpackaging=jar
          mvn install:install-file -Dfile=lib/PlayerPointsAPI-3.1.1.jar \
            -DgroupId=org.black_ixx -DartifactId=playerpoints \
            -Dversion=3.1.1 -Dpackaging=jar
          mvn install:install-file -Dfile=lib/VaultAPI-1.7.1.jar \
            -DgroupId=net.milkbowl.vault -DartifactId=VaultAPI \
            -Dversion=1.7.1 -Dpackaging=jar

      - name: Build with Maven
        run: |
          mvn clean package \
            -Dspigot.api.version=26.2-R0.1-SNAPSHOT \
            --batch-mode

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteTeleport-${{ steps.version.outputs.plugin_version }}
          path: target/LiteTeleport-*.jar

    outputs:
      plugin_version: ${{ steps.version.outputs.plugin_version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LiteTeleport-${{ needs.build.outputs.plugin_version }}
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*.jar
          generate_release_notes: true